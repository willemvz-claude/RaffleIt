version: '3.9'

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: raffleit
      POSTGRES_USER: raffleit
      POSTGRES_PASSWORD: raffleit_pass
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U raffleit -d raffleit"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    ports:
      - "5000:80"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Host=db;Port=5432;Database=raffleit;Username=raffleit;Password=raffleit_pass
      - Jwt__Key=RaffleItSuperSecretKey_ChangeInProduction_2024!
      - Jwt__Issuer=RaffleIt
      - Jwt__Audience=RaffleItUsers
      - Jwt__ExpiryHours=24
      - AppSettings__BaseUrl=http://localhost:8080
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        - API_BASE_URL=http://localhost:5000
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  postgres_data:
